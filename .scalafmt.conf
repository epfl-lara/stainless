version = "3.8.3"

# Only the files listed here are formatted.
project.includePaths = [
  "glob:**/frontends/library/stainless/math/Unsigned.scala",
  "glob:**/frontends/dotty/src/it/scala/stainless/ExpectedFiles.scala",
  "glob:**/frontends/dotty/src/test/scala/stainless/DebugPhasesSuite.scala"
]

maxColumn = 120
align.preset = none
docstrings.wrapMaxColumn = 80
docstrings.style = AsteriskSpace
runner.dialect = scala3
newlines.avoidAfterYield = false
newlines.source = keep
rewrite.scala3.convertToNewSyntax = yes
rewrite.scala3.removeOptionalBraces = yes
rewrite.rules = [Imports]
rewrite.imports.sort = scalastyle
rewrite.imports.groups = [["java\\..*"], ["scala\\..*"], ["dotty\\..*"]]

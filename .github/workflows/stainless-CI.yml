name: Stainless CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Cancel a pull request's superseded runs, with the jobs of both JDKs, when new
# commits are pushed.
# Runs on main are never cancelled, so every merge still gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (JDK ${{ matrix.java }})
    # A job takes about 10 minutes. Without this limit, a test that hangs keeps a runner
    # busy until GitHub cancels the job, after 6 hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 25
            extra-java-opts: "-XX:+UseCompactObjectHeaders"
    runs-on:
      labels: [self-hosted, linux]
    env:
      # Java options, read by the sbt launcher and the Stainless launcher scripts
      JAVA_OPTS: -Dsbt.io.implicit.relative.glob.conversion=allow -Xss512M -Xms1024M -Xmx12G -XX:MaxMetaspaceSize=2G -XX:+UseCodeCacheFlushing -XX:ReservedCodeCacheSize=768M ${{ matrix.extra-java-opts }}
      # one directory per matrix entry, as the jobs of a run can share a machine
      JAVA_OPTS_TMP_DIR: /tmp/tmp_${{ github.run_id }}_${{ github.run_attempt }}_jdk${{ matrix.java }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
    - name: Setup java options
      # The runners share one machine, with each other and with its users. Without
      # -XX:ActiveProcessorCount, each JVM sizes its GC threads, its JIT threads and its default
      # thread pools for all the processors of the machine. The option replaces the number of
      # processors that the JVM detects, even with a larger one, hence the minimum with nproc.
      run: |
          PROCESSORS=$(( $(nproc) < 16 ? $(nproc) : 16 )) && \
          echo "JAVA_OPTS=$JAVA_OPTS -XX:ActiveProcessorCount=$PROCESSORS -Djava.io.tmpdir=$JAVA_OPTS_TMP_DIR" >> "$GITHUB_ENV" && \
          echo "SBT_OPTS=-Djava.io.tmpdir=$JAVA_OPTS_TMP_DIR --sbt-dir $JAVA_OPTS_TMP_DIR --ivy $JAVA_OPTS_TMP_DIR/ivy2" >> "$GITHUB_ENV"
    - name: Creating temp folder
      run: rm -rf $JAVA_OPTS_TMP_DIR && mkdir -p $JAVA_OPTS_TMP_DIR && chmod 777 $JAVA_OPTS_TMP_DIR
    - name: Install solvers
      run: ./stainless-ci.sh --install-solvers $GITHUB_WORKSPACE/.local/bin
    - name: Add solvers to PATH
      run: echo "$GITHUB_WORKSPACE/.local/bin" >> $GITHUB_PATH
    - name: Test solvers availability
      run: cvc5 --version && z3 --version && cvc4 --version
    - name: Build and Package
      run: ./stainless-ci.sh --build-only && echo "PATH=./frontends/dotty/target/universal/stage/bin:$PATH" >> "$GITHUB_ENV"
    - name: Run Tests and Integration Tests
      run: ./stainless-ci.sh --skip-build --skip-bolts --skip-sbt-plugin
    - name: Sbt Plugin Tests
      run: ./stainless-ci.sh --skip-build --skip-tests --skip-bolts
    - name: Clean up
      run: rm -rf $JAVA_OPTS_TMP_DIR

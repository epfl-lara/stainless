title: Stainless
name: stainless
version: git # set corrrectly by `override-prime`
summary: Program verifier and model checker for Scala 3
description: |
  Stainless is a program verifier and counterexample finder for Scala 3. It uses
  SMT solvers (z3, cvc5, princess), function unfolding, and invariant inference to
  prove and disprove program safety and termination.
website: https://github.com/epfl-lara/stainless
source-code: https://github.com/epfl-lara/stainless
license: Apache-2.0

# build metadata and dependencies
type: app
base: core24
adopt-info: stainless # the build part `stainless` below
platforms:
  amd64:

grade: devel
confinement: strict

# exposed commands and what they refer to internally
apps:
  stainless:
    command: stainless
    plugs: [home]
    environment:
      JAVA_HOME: $SNAP/usr/lib/jvm/java-25-openjdk-amd64
      PATH: $JAVA_HOME/bin:$PATH
  # cli:
  #   command: stainless-cli
  #   plugs: [home, network, network-bind]
  #   environment:
  #     JAVA_HOME: $SNAP/usr/lib/jvm/java-25-openjdk-amd64
  #     PATH: $JAVA_HOME/bin:$PATH

# actual build
parts:
  wrapper:
    plugin: dump
    source: snap/local
    source-type: local

  # scala-cli:
  #   plugin: nil
  #   override-pull: |
  #     wget -c https://github.com/VirtusLab/scala-cli/releases/download/v1.6.1/scala-cli.jar
  #   override-build: |
  #     install -Dm644 scala-cli.jar "$CRAFT_PART_INSTALL/usr/share/java/scala-cli/scala-cli.jar"

  stainless:
    plugin: nil
    source: .
    source-type: local

    build-packages: [git, wget, unzip, openjdk-25-jdk]
    stage-packages: [openjdk-25-jre-headless, z3, cvc5]
    build-environment:
      - JAVA_HOME: /usr/lib/jvm/java-25-openjdk-amd64
      - PATH: $JAVA_HOME/bin:$PATH

    override-pull: |
      craftctl default

      SBT_VERSION="$(awk -F= '/^[[:space:]]*sbt[.]version[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' project/build.properties)"
      : "${SBT_VERSION:?Missing sbt.version in project/build.properties}"
      wget -c "https://github.com/sbt/sbt/releases/download/v${SBT_VERSION}/sbt-${SBT_VERSION}.zip"
      unzip -o "sbt-${SBT_VERSION}.zip"

    override-build: |
      ./sbt/bin/sbt 'stainless-dotty-standalone/assembly' 'stainless-library/package' 'stainless-library/packageSrc'

      # set snap package version
      craftctl set version="$(git describe --long | sed 's/\([^-]*-\)g/r\1/;s/-/./g')"

      # Ask sbt for the artifact paths
      ./sbt/bin/sbt -Dsbt.log.noformat=true --error \
        'print stainless-dotty-standalone / assembly / assemblyOutputPath' \
        'print stainless-library / Compile / packageBin / artifactPath' \
        'print stainless-library / Compile / packageSrc / artifactPath' > snap-artifacts.txt
      {
        read -r STAINLESS_JAR
        read -r LIBRARY_JAR
        read -r LIBRARY_SOURCES_JAR
      } < snap-artifacts.txt

      install -Dm644 "$STAINLESS_JAR" "$CRAFT_PART_INSTALL/usr/share/java/stainless/stainless.jar"
      install -Dm644 "$LIBRARY_JAR" "$CRAFT_PART_INSTALL/usr/lib/stainless/stainless-library.jar"
      install -Dm644 "$LIBRARY_SOURCES_JAR" "$CRAFT_PART_INSTALL/usr/lib/stainless/stainless-library-sources.jar"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/licenses/stainless/LICENSE"

